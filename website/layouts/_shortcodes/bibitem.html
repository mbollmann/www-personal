{{ $key := .Get 0 }}
{{ $opts := .Get 1 }}
{{- with index hugo.Data.bibliography $key }}
<div class="bibitem{{ if in $opts "muted" }} text-body-tertiary{{ end }}">
  {{ .html | safeHTML }}
  {{- if not (in $opts "nobib") }}
  <a class="badge rounded-pill text-bg-light" role="button" data-bs-toggle="collapse" href="#{{ anchorize $key }}" aria-expanded="false" aria-controls="collapseExample" style="vertical-align: text-bottom;">
    BibTeX
  </a>
  {{- end }}
  {{- $.InnerDeindent -}}
</div>
<div class="collapse" id="{{ anchorize $key }}">
  <pre class="mt-2 border border-rounded py-2 px-3">
    {{- .raw -}}
  </pre>
</div>
{{- else }}
  {{- errorf "The %q shortcode was unable to find %s" $.Name $key }}
{{- end -}}
